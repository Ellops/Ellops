<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 228" width="860" height="228" role="img" aria-label="Ewerton Vasconcelos Lopes — Embedded Systems, IoT and Mechatronics Engineer">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d12"/>
      <stop offset="55%" stop-color="#0e1620"/>
      <stop offset="100%" stop-color="#0b1118"/>
    </linearGradient>
    <radialGradient id="glow1" cx="16%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="88%" cy="80%" r="48%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#94a3b8" fill-opacity="0.16"/>
    </pattern>
  </defs>

  <!-- Outer card -->
  <rect width="860" height="228" rx="16" fill="url(#bg)"/>
  <rect width="860" height="228" rx="16" fill="url(#dots)"/>
  <rect width="860" height="228" rx="16" fill="url(#glow1)"/>
  <rect width="860" height="228" rx="16" fill="url(#glow2)"/>
  <rect x="1" y="1" width="858" height="226" rx="15" fill="none" stroke="#94a3b8" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- Subtle decorative PCB traces on right -->
  <g stroke="#2dd4bf" stroke-opacity="0.24" stroke-width="1.5" fill="none" stroke-linecap="round">
    <path d="M620 44 H690 L712 66 H810"/>
    <path d="M652 78 H736 L754 96 H818"/>
    <path d="M685 112 H768 L788 132 H824"/>
    <circle cx="620" cy="44" r="3" fill="#2dd4bf" fill-opacity="0.5"/>
    <circle cx="810" cy="66" r="3" fill="#2dd4bf" fill-opacity="0.5"/>
    <circle cx="652" cy="78" r="3" fill="#f59e0b" fill-opacity="0.65"/>
    <circle cx="818" cy="96" r="3" fill="#2dd4bf" fill-opacity="0.5"/>
    <circle cx="685" cy="112" r="3" fill="#38bdf8" fill-opacity="0.5"/>
  </g>

  <!-- Live Oscilloscope waveform accent (right bottom) -->
  <path d="M610 176 C628 176, 636 146, 654 146 C672 146, 680 190, 698 190 C716 190, 724 144, 742 144 C760 144, 768 188, 786 188 C802 188, 810 162, 824 162"
        fill="none" stroke="#2dd4bf" stroke-width="2.2" stroke-opacity="0.72" stroke-linecap="round"/>
  <circle cx="824" cy="162" r="4" fill="#2dd4bf"/>
  <circle cx="824" cy="162" r="8" fill="#2dd4bf" fill-opacity="0.22"/>

  <!-- Top status pill -->
  <rect x="34" y="26" width="268" height="26" rx="13" fill="#2dd4bf" fill-opacity="0.11" stroke="#2dd4bf" stroke-opacity="0.35"/>
  <circle cx="50" cy="39" r="4" fill="#2dd4bf"/>
  <text x="63" y="43" fill="#2dd4bf" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="0.4">NATAL, BRAZIL · EMBEDDED &amp; IOT</text>

  <!-- Main Heading -->
  <text x="34" y="102" fill="#f1f5f9" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="36" font-weight="700" letter-spacing="-0.8">
    Ewerton Vasconcelos <tspan fill="#2dd4bf">Lopes</tspan>
  </text>

  <!-- Subtitle -->
  <text x="34" y="134" fill="#9fb0c4" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5">
    Mechatronics Engineer crafting low-level firmware, resilient IoT platforms &amp; edge-to-cloud AI
  </text>

  <!-- Bottom Telemetry Metric Pills -->
  <g transform="translate(34, 158)">
    <rect x="0" y="0" width="166" height="44" rx="10" fill="#121a24" stroke="#94a3b8" stroke-opacity="0.18"/>
    <text x="14" y="17" fill="#6f8298" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" letter-spacing="0.6">IOT R&amp;D · UFRN</text>
    <text x="14" y="34" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700">3+ Years (SAIOT)</text>

    <rect x="178" y="0" width="186" height="44" rx="10" fill="#121a24" stroke="#f59e0b" stroke-opacity="0.32"/>
    <text x="192" y="17" fill="#f59e0b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" letter-spacing="0.6">ACADEMIC MERIT</text>
    <text x="192" y="34" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700">Top Graduate · S&amp;T</text>

    <rect x="376" y="0" width="176" height="44" rx="10" fill="#121a24" stroke="#2dd4bf" stroke-opacity="0.32"/>
    <text x="390" y="17" fill="#2dd4bf" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" letter-spacing="0.6">CORE ARCHITECTURE</text>
    <text x="390" y="34" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700">Edge → Cloud IoT</text>
  </g>
</svg>
