<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 226" width="860" height="226" role="img" aria-label="Verified GitHub Codebase Footprint and Hardware Stack for Ellops">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1017"/>
      <stop offset="100%" stop-color="#111822"/>
    </linearGradient>
  </defs>

  <rect width="860" height="226" rx="14" fill="url(#cardBg)" stroke="#94a3b8" stroke-opacity="0.2" stroke-width="1.2"/>

  <!-- Left Panel: Verified Core Authored Codebase -->
  <text x="26" y="32" fill="#2dd4bf" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="600" letter-spacing="0.8">VERIFIED CORE AUTHORED CODE · GITHUB.COM/ELLOPS</text>
  <text x="26" y="52" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">Language Footprint (excl. vendored docs)</text>

  <!-- Bar 1: C -->
  <g transform="translate(26, 72)">
    <text x="0" y="11" fill="#f1f5f9" font-family="ui-monospace, Menlo, monospace" font-size="11.5" font-weight="600">C (Firmware, Drivers, PIO)</text>
    <text x="386" y="11" text-anchor="end" fill="#2dd4bf" font-family="ui-monospace, Menlo, monospace" font-size="11.5" font-weight="600">77.1% · 407 KB</text>
    <rect x="0" y="18" width="386" height="8" rx="4" fill="#1e293b"/>
    <rect x="0" y="18" width="298" height="8" rx="4" fill="#2dd4bf"/>
  </g>

  <!-- Bar 2: Python -->
  <g transform="translate(26, 108)">
    <text x="0" y="11" fill="#e2e8f0" font-family="ui-monospace, Menlo, monospace" font-size="11.5">Python (AI, Vision, Thermal Models)</text>
    <text x="386" y="11" text-anchor="end" fill="#f59e0b" font-family="ui-monospace, Menlo, monospace" font-size="11.5">13.3% · 70 KB</text>
    <rect x="0" y="18" width="386" height="8" rx="4" fill="#1e293b"/>
    <rect x="0" y="18" width="52" height="8" rx="4" fill="#f59e0b"/>
  </g>

  <!-- Bar 3: CMake & Make -->
  <g transform="translate(26, 144)">
    <text x="0" y="11" fill="#e2e8f0" font-family="ui-monospace, Menlo, monospace" font-size="11.5">CMake &amp; Makefile (ESP-IDF / Pico SDK)</text>
    <text x="386" y="11" text-anchor="end" fill="#38bdf8" font-family="ui-monospace, Menlo, monospace" font-size="11.5">7.6% · 40 KB</text>
    <rect x="0" y="18" width="386" height="8" rx="4" fill="#1e293b"/>
    <rect x="0" y="18" width="30" height="8" rx="4" fill="#38bdf8"/>
  </g>

  <!-- Bar 4: Other -->
  <g transform="translate(26, 180)">
    <text x="0" y="11" fill="#cbd5e1" font-family="ui-monospace, Menlo, monospace" font-size="11.5">PureBasic / Solidity / JS / C++</text>
    <text x="386" y="11" text-anchor="end" fill="#a78bfa" font-family="ui-monospace, Menlo, monospace" font-size="11.5">2.0% · 11 KB</text>
    <rect x="0" y="18" width="386" height="8" rx="4" fill="#1e293b"/>
    <rect x="0" y="18" width="12" height="8" rx="4" fill="#a78bfa"/>
  </g>

  <!-- Divider -->
  <line x1="438" y1="22" x2="438" y2="204" stroke="#94a3b8" stroke-opacity="0.18" stroke-width="1"/>

  <!-- Right Panel: Silicon to Cloud Layers -->
  <text x="462" y="32" fill="#2dd4bf" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="600" letter-spacing="0.8">SILICON-TO-CLOUD ENGINEERING STACK</text>
  <text x="462" y="52" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">Production Architecture Layers</text>

  <g transform="translate(462, 68)" font-family="ui-monospace, Menlo, monospace" font-size="10">
    <rect x="0" y="0" width="374" height="28" rx="7" fill="#121a24" stroke="#2dd4bf" stroke-opacity="0.32"/>
    <text x="12" y="18" fill="#2dd4bf" font-weight="600">L0 SILICON</text>
    <text x="98" y="18" fill="#cbd5e1">ESP32 · ESP8266 · RP2040 PIO · STM32</text>

    <rect x="0" y="36" width="374" height="28" rx="7" fill="#121a24" stroke="#94a3b8" stroke-opacity="0.18"/>
    <text x="12" y="54" fill="#38bdf8" font-weight="600">L1 RTOS</text>
    <text x="98" y="54" fill="#cbd5e1">FreeRTOS · ESP-IDF · PID · SPI / I2C</text>

    <rect x="0" y="72" width="374" height="28" rx="7" fill="#121a24" stroke="#94a3b8" stroke-opacity="0.18"/>
    <text x="12" y="90" fill="#f59e0b" font-weight="600">L2 EDGE</text>
    <text x="98" y="90" fill="#cbd5e1">MQTT · SPIFFS FIFO · WebSockets · OTA</text>

    <rect x="0" y="108" width="374" height="28" rx="7" fill="#121a24" stroke="#94a3b8" stroke-opacity="0.18"/>
    <text x="12" y="126" fill="#a78bfa" font-weight="600">L3 CLOUD</text>
    <text x="98" y="126" fill="#cbd5e1">Docker · InfluxDB · Grafana · OpenCV</text>
  </g>
</svg>
